name: Publish

# Publish the `rizzma` crate to crates.io whenever its version changes.
#
# On every push to `main` that touches a manifest (or this workflow), the job
# reads the version from `crates/rizzma/Cargo.toml`, asks crates.io whether that
# exact version is already published, and only runs `cargo publish` when it is
# new. The check makes the workflow idempotent: re-runs, or manifest edits that
# leave the version untouched, are no-ops rather than failed publishes.
#
# Requires a `CARGO_REGISTRY_TOKEN` repository secret (a crates.io API token with
# publish scope for `rizzma`).

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "crates/rizzma/Cargo.toml"
      - ".github/workflows/publish.yml"
  # Allow re-running the publish by hand (e.g. after fixing the crates.io token
  # scope) without needing another version bump.
  workflow_dispatch:

# Never cancel an in-flight publish, and never run two at once.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish rizzma to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup honors rust-toolchain.toml, installing the pinned stable.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Read crate version
        id: ver
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "rizzma") | .version')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::could not read rizzma version from cargo metadata"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rizzma manifest version: $version"

      - name: Check whether this version is already on crates.io
        id: check
        run: |
          version="${{ steps.ver.outputs.version }}"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: rizzma-publish-ci (https://github.com/OrbitalCommons/rizzma)" \
            "https://crates.io/api/v1/crates/rizzma/${version}")
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "rizzma ${version} is already on crates.io (HTTP ${code}) — skipping publish."
          elif [ "$code" = "404" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "rizzma ${version} is not yet published (HTTP 404) — will publish."
          else
            echo "::error::unexpected HTTP ${code} from crates.io while checking rizzma ${version}"
            exit 1
          fi

      - name: Publish to crates.io
        if: steps.check.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set — skipping publish of rizzma ${{ steps.ver.outputs.version }}. Add the secret to enable auto-publishing on version bumps."
            exit 0
          fi
          cargo publish -p rizzma

  # The wasm renderer that draws portable figures (`.riz`) in a browser.
  #
  # Published as *immutable GitHub release assets* rather than to gh-pages,
  # because the gallery deploy replaces that branch wholesale (`force_orphan`)
  # and a host needs to be able to fetch the exact renderer an archived figure
  # was authored against — see `design/10-portable-figure.md` section 9.
  #
  # A host is expected to vet a runtime once and serve its own copy. The digest
  # here identifies which bytes those are; it never authorizes anything.
  runtime:
    name: publish the portable-figure runtime
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Read crate version
        id: ver
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "rizzma") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip when this release already exists
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release v${{ steps.ver.outputs.version }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install wasm-pack
        if: steps.gate.outputs.exists == 'false'
        run: |
          target=x86_64-unknown-linux-musl
          curl -sL -o /tmp/wasm-pack.tgz "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-${target}.tar.gz"
          tar xzf /tmp/wasm-pack.tgz -C /tmp
          sudo mv "/tmp/wasm-pack-v${WASM_PACK_VERSION}-${target}/wasm-pack" /usr/local/bin/
        env:
          WASM_PACK_VERSION: 0.15.0

      - name: Build and address the runtime by content
        if: steps.gate.outputs.exists == 'false'
        id: build
        run: |
          wasm-pack build --target web --out-dir www/pkg crates/rizzma --features wasm
          mkdir -p runtime-out
          cp crates/rizzma/www/pkg/rizzma_bg.wasm crates/rizzma/www/pkg/rizzma.js runtime-out/
          cp crates/rizzma/www/rizzma-mount.js runtime-out/
          sha=$(sha256sum runtime-out/rizzma_bg.wasm | cut -d' ' -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          cargo run -q -p xtask -- runtime-manifest \
            --version "${{ steps.ver.outputs.version }}" --sha256 "$sha" \
            > runtime-out/runtime.json
          cat runtime-out/runtime.json

      - name: Publish the release
        if: steps.gate.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          {
            echo "Portable-figure runtime for rizzma ${VERSION}."
            echo
            echo '| file | purpose |'
            echo '|---|---|'
            echo '| `rizzma_bg.wasm` | the renderer |'
            echo '| `rizzma.js` | wasm-bindgen glue |'
            echo '| `rizzma-mount.js` | loader: mount a `.riz` into a canvas |'
            echo '| `runtime.json` | version, digest, and the schema range it renders |'
            echo
            echo "\`rizzma_bg.wasm\` sha256: \`${SHA}\`"
            echo
            echo 'Vet these bytes once, serve your own copy, and resolve renderers'
            echo 'through your own allowlist. A digest an artifact carries about'
            echo 'itself identifies bytes — it never authorizes running them.'
          } > notes.md
          gh release create "v${VERSION}" \
            --title "rizzma ${VERSION}" --notes-file notes.md \
            runtime-out/rizzma_bg.wasm runtime-out/rizzma.js \
            runtime-out/rizzma-mount.js runtime-out/runtime.json
