name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Two wasm artifacts are sized: the *demo* bundle (what docs.rs pages and
  # the gallery demo load, no portable importer or JSON codec) and the
  # *runtime* bundle (adds `.riz` rendering). Both caps are tripwires for
  # runaway growth, not targets. They measure raw cargo output, about 1 MiB
  # of which is wasm-bindgen descriptors and debug names that never ship
  # (wasm-bindgen + wasm-opt -Oz brings the runtime to about 1.9 MB).
  WASM_SIZE_MAX_BYTES: 5242880
  WASM_RUNTIME_SIZE_MAX_BYTES: 5242880

jobs:
  msrv:
    name: msrv (1.85) library check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Dependents build the library on the `rust-version` in Cargo.toml. The
      # dev-dependencies (resvg) need a newer Rust, so only the library is
      # checked here; tests run on the pinned toolchain below.
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Check with all features
        run: cargo +1.85 check -p rizzma --lib --all-features

      - name: Check without default features
        run: cargo +1.85 check -p rizzma --lib --no-default-features

  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup honors rust-toolchain.toml, installing the pinned stable
      # (channel + rustfmt/clippy components) automatically.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # Within 1.x, `default-features = false` keeps everything it offered in
      # 1.13 (PNG output, date axes): this test uses that surface.
      - name: Build without default features
        run: |
          cargo build -p rizzma --no-default-features
          cargo test -p rizzma --no-default-features --test no_default_features_api

      # The library's own tests without `dates`: what an import reports when
      # the artifact needs a feature this build leaves out. (The tests render
      # to pixels, so they keep `raster`.)
      - name: Test portable without optional features
        run: cargo test -p rizzma --lib --no-default-features --features portable,raster

      - name: Wasm check
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --workspace --exclude xtask --target wasm32-unknown-unknown

      # Doc consistency: render the gallery, then verify every `gallery_*.png`
      # referenced in the README / doc comments is actually produced by the
      # gallery example (catches typo'd or stale image URLs).
      - name: Render gallery
        run: cargo run -p rizzma --example gallery

      - name: Check gallery doc links
        run: cargo xtask check-gallery-links --strict

      # Broken intra-doc links (and other rustdoc warnings) fail the build.
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm-size:
    name: wasm size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup honors rust-toolchain.toml, installing the pinned stable
      # toolchain automatically.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Check demo bundle size budget
        run: |
          cargo build -p rizzma --no-default-features --features wasm,plot3d \
            --target wasm32-unknown-unknown --release
          cargo xtask wasm-size target/wasm32-unknown-unknown/release/rizzma.wasm \
            --max-bytes "$WASM_SIZE_MAX_BYTES"

      - name: Check portable-runtime bundle size budget
        run: |
          cargo build -p rizzma --features wasm --target wasm32-unknown-unknown --release
          cargo xtask wasm-size target/wasm32-unknown-unknown/release/rizzma.wasm \
            --max-bytes "$WASM_RUNTIME_SIZE_MAX_BYTES"

  # Proves the wasm-bindgen boundary end-to-end in a real (headless) browser:
  # build through the JS surface, render into a <canvas>, read pixels back,
  # and drive pan/zoom with synthetic DOM events. Kept out of the required
  # `fmt + clippy + test` gate so the fast path stays fast.
  wasm-test:
    name: wasm browser tests
    runs-on: ubuntu-latest
    env:
      WASM_PACK_VERSION: 0.15.0
    steps:
      - uses: actions/checkout@v7

      # rustup honors rust-toolchain.toml, installing the pinned stable
      # toolchain automatically.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) target="x86_64-unknown-linux-musl" ;;
            aarch64|arm64) target="aarch64-unknown-linux-musl" ;;
            *) echo "unsupported wasm-pack host architecture: $arch" >&2; exit 1 ;;
          esac
          curl -sL -o /tmp/wasm-pack.tgz "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-${target}.tar.gz"
          tar xzf /tmp/wasm-pack.tgz -C /tmp
          sudo mv "/tmp/wasm-pack-v${WASM_PACK_VERSION}-${target}/wasm-pack" /usr/local/bin/
          wasm-pack --version

      - name: Run headless Chrome tests
        run: wasm-pack test --headless --chrome crates/rizzma --test wasm_browser
