name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Two wasm artifacts are built from this crate, and they are sized
  # separately because they are different deliverables.
  #
  # The *demo* bundle is what docs.rs pages and the gallery demo load. Those
  # build figures imperatively, so they carry no portable-figure importer and
  # no JSON codec. 2.625 MiB, raised from 2.5 MiB for the 1.3.0 wasm surface
  # growth (WasmAxes3D, imshow + live image updates, live scatter offsets —
  # each export carries wasm-bindgen glue); still a tripwire for bloat.
  WASM_SIZE_MAX_BYTES: 2752512
  # The *runtime* bundle additionally renders `.riz` artifacts, which pulls in
  # serde_json and the wire model's derives — about 590 KiB. It is fetched once
  # per host and cached, never per figure, and a host that only shows posters
  # never fetches it at all (that is what `rizzma-portable` is for). 3.2 MiB,
  # raised from 3.15 for schema 4 (the Control/Grid wire derives, bilinear
  # sampling, and control evaluation — the slider manifest is hand-formatted
  # JSON precisely so this raise stayed under 8 KiB instead of 28).
  WASM_RUNTIME_SIZE_MAX_BYTES: 3355443

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup honors rust-toolchain.toml, installing the pinned stable
      # (channel + rustfmt/clippy components) automatically.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Build without default features
        run: cargo build -p rizzma --no-default-features

      - name: Wasm check
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --workspace --exclude xtask --target wasm32-unknown-unknown

      # Doc consistency: render the gallery, then verify every `gallery_*.png`
      # referenced in the README / doc comments is actually produced by the
      # gallery example (catches typo'd or stale image URLs).
      - name: Render gallery
        run: cargo run -p rizzma --example gallery

      - name: Check gallery doc links
        run: cargo xtask check-gallery-links --strict

      # Broken intra-doc links (and other rustdoc warnings) fail the build.
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm-size:
    name: wasm size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup honors rust-toolchain.toml, installing the pinned stable
      # toolchain automatically.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Check demo bundle size budget
        run: |
          cargo build -p rizzma --no-default-features --features wasm,plot3d \
            --target wasm32-unknown-unknown --release
          cargo xtask wasm-size target/wasm32-unknown-unknown/release/rizzma.wasm \
            --max-bytes "$WASM_SIZE_MAX_BYTES"

      - name: Check portable-runtime bundle size budget
        run: |
          cargo build -p rizzma --features wasm --target wasm32-unknown-unknown --release
          cargo xtask wasm-size target/wasm32-unknown-unknown/release/rizzma.wasm \
            --max-bytes "$WASM_RUNTIME_SIZE_MAX_BYTES"

  # Proves the wasm-bindgen boundary end-to-end in a real (headless) browser:
  # build through the JS surface, render into a <canvas>, read pixels back,
  # and drive pan/zoom with synthetic DOM events. Kept out of the required
  # `fmt + clippy + test` gate so the fast path stays fast.
  wasm-test:
    name: wasm browser tests
    runs-on: ubuntu-latest
    env:
      WASM_PACK_VERSION: 0.15.0
    steps:
      - uses: actions/checkout@v4

      # rustup honors rust-toolchain.toml, installing the pinned stable
      # toolchain automatically.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) target="x86_64-unknown-linux-musl" ;;
            aarch64|arm64) target="aarch64-unknown-linux-musl" ;;
            *) echo "unsupported wasm-pack host architecture: $arch" >&2; exit 1 ;;
          esac
          curl -sL -o /tmp/wasm-pack.tgz "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-${target}.tar.gz"
          tar xzf /tmp/wasm-pack.tgz -C /tmp
          sudo mv "/tmp/wasm-pack-v${WASM_PACK_VERSION}-${target}/wasm-pack" /usr/local/bin/
          wasm-pack --version

      - name: Run headless Chrome tests
        run: wasm-pack test --headless --chrome crates/rizzma --test wasm_browser
