[package]
name = "rizzma-portable"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Container framing and renderer-free inspection for rizzma portable figures (.riz)."
readme = "README.md"
keywords = ["rizzma", "plotting", "visualization", "wasm"]
categories = ["visualization", "encoding", "wasm"]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
# `float_roundtrip` is load-bearing: without it f64 parses back one ULP off and
# a re-exported artifact differs from its original.
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
