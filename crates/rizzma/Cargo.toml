[package]
name = "rizzma"
version = "1.14.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A Rust reimplementation of the good parts of matplotlib/pyplot, with first-class wasm support."
readme = "README.md"
keywords = ["plotting", "matplotlib", "visualization", "charts", "wasm"]
categories = ["visualization", "graphics", "wasm"]

# Injects the live-demo loader into every docs.rs page: `.rizzma-live`
# placeholders in doc comments upgrade to interactive wasm canvases (bundle
# served from the gh-pages `demo/` deployment), with their static gallery
# images left as the fallback.
[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs-header.html"]

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = ["dates", "plot3d", "portable", "pyplot", "raster", "show", "wasm"]
# Native-only: `Figure::show()` / `pyplot::show()` local browser viewer.
show = ["raster"]
# No-ops within 1.x, kept so `features = ["raster"]` / `["dates"]` still
# resolve: the raster backend and date axes are always built, as in 1.13.
# Making them optional changes what `default-features = false` provides, so it
# waits for 2.0.
raster = []
dates = []
plot3d = []
# `Figure::to_portable()` / `from_portable()`: the `.riz` self-describing
# artifact (see `design/10-portable-figure.md`). Pulls in a JSON codec.
portable = ["dep:serde_json", "dep:base64"]
pyplot = ["raster"]
wasm = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "raster"]

[dependencies]
base64 = { version = "0.22.1", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
js-sys = { version = "0.3", optional = true }
png = "0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
# `float_roundtrip` is load-bearing, not a nicety: without it serde_json parses
# f64 back one ULP off, so a re-exported portable figure differs from its
# original. See `portable::tests::json_scalars_round_trip_bit_exactly`.
serde_json = { version = "1.0.150", features = [
    "float_roundtrip",
], optional = true }
tiny-skia = "0.12.0"
ttf-parser = "0.25.1"
wasm-bindgen = { version = "0.2.126", optional = true }
web-sys = { version = "0.3.103", optional = true, features = [
    "Window",
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "ImageData",
    "AddEventListenerOptions",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
] }

[dev-dependencies]
resvg = { version = "0.47.0", default-features = false, features = ["raster-images", "text"] }

# Browser-only integration tests (`wasm-pack test --headless --chrome`); the
# extra web-sys features here are for synthesizing DOM events in those tests.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3.103", features = [
    "MouseEventInit",
    "PointerEventInit",
    "WheelEventInit",
] }
